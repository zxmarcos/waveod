[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "waveod-studio"
version = "0.1.1"
description = "PC app for the waveod firmware (QME-200): presets in waveod's own format, backups, firmware updates, flash dumps"
readme = "README.md"
requires-python = ">=3.10"
# self-contained: only the standard library (Tkinter, ctypes for USB MIDI on Windows)
dependencies = []

[project.optional-dependencies]
# the new interface (--web): the page of ui/ in a pywebview window
web = ["pywebview>=6.2"]

[project.scripts]
waveod-studio = "waveod_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["waveod_studio*"]

[tool.setuptools.package-data]
waveod_studio = ["fonts/*", "web/*", "web/assets/*"]
